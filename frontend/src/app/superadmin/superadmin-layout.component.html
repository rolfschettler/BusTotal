<div class="app-shell">
  <aside class="app-side">
    <a routerLink="/" class="app-brand">
      <span class="app-logo" aria-hidden="true"><i class="bi bi-buildings"></i></span><span class="app-label">{{ brand.name() }}</span>
    </a>

    @if (!forced()) {
      <nav aria-label="Hauptmenü" class="app-menu">
        <a class="app-link" routerLink="/firmen" routerLinkActive="active" title="Firmen"><i class="bi bi-building" aria-hidden="true"></i><span class="app-label">Firmen</span></a>
        <a class="app-link" routerLink="/hilfe" routerLinkActive="active" title="Hilfe"><i class="bi bi-book" aria-hidden="true"></i><span class="app-label">Hilfe</span></a>
      </nav>
    }

    <div class="app-user">
      <button type="button" class="app-link" (click)="helpPanel.toggle()" title="Hilfe zu dieser Seite (F1)">
        <i class="bi bi-question-circle" aria-hidden="true"></i><span class="app-label">Hilfe (F1)</span>
      </button>
      @if (auth.user(); as u) {
        <div ngbDropdown placement="top-start" container="body">
          <button type="button" class="app-link" ngbDropdownToggle id="userMenu">
            <i class="bi bi-person-circle" aria-hidden="true"></i><span class="app-label">{{ u.name }}<small>Betreiber</small></span>
          </button>
          <div ngbDropdownMenu aria-labelledby="userMenu">
            <div class="dropdown-item-text small text-body-secondary">{{ u.email }}</div>
            <div class="dropdown-divider"></div>
            <a ngbDropdownItem routerLink="/konto"><i class="bi bi-key me-2" aria-hidden="true"></i>Passwort ändern</a>
            <button ngbDropdownItem type="button" (click)="auth.logout()"><i class="bi bi-box-arrow-right me-2" aria-hidden="true"></i>Abmelden</button>
          </div>
        </div>
      }
    </div>
  </aside>

  <main class="app-main" [class.full]="fullPage()">
    <div class="app-content" [class.full]="fullPage()">
      <router-outlet />
    </div>
  </main>
</div>
