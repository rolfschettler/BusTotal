<div class="d-flex flex-wrap align-items-baseline justify-content-between gap-2 mb-4">
  <h1 class="h3 mb-0">{{ greeting() }}</h1>
  <span class="text-body-secondary">{{ today | date: 'EEEE, d. MMMM y' }}</span>
</div>

<div class="tiles">
  @for (t of tiles(); track t.id) {
    <ng-container [ngComponentOutlet]="t.component" />
  }
</div>
