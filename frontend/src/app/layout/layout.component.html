<header class="top">
  <strong class="brand">BusTotal</strong>
  <nav>
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Start</a>
    @if (auth.user()?.role !== 'fahrer') {
      <a routerLink="/kunden" routerLinkActive="active">Kunden</a>
    }
    <a routerLink="/einstellungen" routerLinkActive="active">Einstellungen</a>
  </nav>
  <span class="spacer"></span>
  @if (auth.user(); as u) {
    <span class="who">{{ u.name }} · {{ rolle(u.role) }}</span>
  }
  <button type="button" (click)="auth.logout()">Abmelden</button>
</header>

<main class="scroll">
  <div class="content">
    <router-outlet />
  </div>
</main>
